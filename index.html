<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Gio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        p {
            color: #bbb;
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Sprint Gio</h1>
        <p>vespa pink yang di buat di SMR GARAGE77.</p>
        <button onclick="alert('Halo! Website berhasil berjalan.')">
            Klik untuk melihat cerita
        </button>
    </div>

</html>
