<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foto Sprint.Gio — A Story of Coraggio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #fff;
            overflow-x: hidden;
        }

        /* =========================
           HALAMAN FOTO
        ========================== */

        #photos {
            min-height: 100vh;
            padding: 80px 20px;
            background:
                radial-gradient(circle at top, #292929 0%, #0b0b0b 45%, #050505 100%);
        }

        .photo-container {
            max-width: 1100px;
            margin: auto;
        }

        /* =========================
           HEADER
        ========================== */

        .photo-header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 1s ease;
        }

        .small-title {
            font-size: 14px;
            letter-spacing: 5px;
            color: #999;
            margin-bottom: 20px;
        }

        .photo-header h1 {
            font-size: clamp(42px, 8vw, 75px);
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .photo-header h2 {
            font-size: clamp(18px, 3vw, 27px);
            font-weight: normal;
            color: #aaa;
        }

        .line {
            width: 80px;
            height: 3px;
            background: #fff;
            margin: 30px auto;
        }

        /* =========================
           GALERI FOTO
        ========================== */

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            animation: galleryIn 1.2s ease;
        }

        .photo-card {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid #333;
            background: #111;
            min-height: 280px;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
            transition: .4s;
            cursor: pointer;
        }

        .photo-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #777;
            box-shadow: 0 25px 70px rgba(255,255,255,.08);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            min-height: 280px;
            object-fit: cover;
            display: block;
            transition: .5s;
        }

        .photo-card:hover img {
            transform: scale(1.08);
        }

        /* Tulisan ketika foto belum ada */

        .photo-placeholder {
            min-height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #777;
            font-size: 18px;
            padding: 20px;
        }

        /* =========================
           TOMBOL KEMBALI
        ========================== */

        .back-button {
            display: block;
            width: fit-content;
            margin: 60px auto 0;

            padding: 15px 30px;
            border-radius: 50px;

            background: transparent;
            color: #ccc;

            border: 1px solid #444;

            text-decoration: none;
            font-weight: bold;

            transition: .3s;
        }

        .back-button:hover {
            background: #fff;
            color: #111;
            border-color: #fff;
            transform: translateY(-4px);
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            text-align: center;
            color: #555;
            margin-top: 70px;
            font-size: 13px;
        }

        /* =========================
           LIGHTBOX
        ========================== */

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,.94);

            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 90vh;

            border-radius: 15px;

            box-shadow: 0 20px 80px rgba(0,0,0,.8);

            animation: zoomIn .3s ease;
        }

        .close {
            position: absolute;
            top: 25px;
            right: 35px;

            font-size: 45px;
            color: #fff;

            cursor: pointer;

            transition: .3s;
        }

        .close:hover {
            transform: scale(1.2);
            color: #ccc;
        }

        /* =========================
           ANIMASI
        ========================== */

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes galleryIn {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* =========================
           HP
        ========================== */

        @media (max-width: 800px) {

            #photos {
                padding: 60px 15px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .photo-card {
                min-height: 220px;
            }

            .photo-card img {
                min-height: 220px;
            }

        }

        @media (max-width: 500px) {

            .gallery {
                grid-template-columns: 1fr;
            }

            .photo-card {
                min-height: 300px;
            }

            .photo-card img {
                min-height: 300px;
            }

        }
    </style>
</head>

<body>

    <!-- =========================
         HALAMAN FOTO
    ========================== -->

    <section id="photos">

        <div class="photo-container">

            <!-- HEADER -->

            <div class="photo-header">

            </div>


            <!-- =========================
                 KEMBALI
            ========================== -->

            <a
                class="back-button"
                href="index.html"
            >
                ← Kembali ke cerita
            </a>


            <footer>
                © 2026 Sprint.Gio — A Story of Coraggio
            </footer>

        </div>

    </section>


    <!-- =========================
         LIGHTBOX
    ========================== -->

    <div
        class="lightbox"
        id="lightbox"
        onclick="closePhoto()"
    >

        <span class="close">
            ×
        </span>

        <img
            id="lightboxImage"
            src=""
            alt="Foto Sprint.Gio"
            onclick="event.stopPropagation()"
        >

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        function openPhoto(photo) {

            const lightbox =
                document.getElementById("lightbox");

            const image =
                document.getElementById("lightboxImage");

            image.src = photo;

            lightbox.style.display = "flex";

            document.body.style.overflow = "hidden";
        }


        function closePhoto() {

            const lightbox =
                document.getElementById("lightbox");

            lightbox.style.display = "none";

            document.body.style.overflow = "auto";
        }


        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closePhoto();
            }

        });

    </script>

</body>
</html>
