<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ENGINE,PERFORMANCE,LOCK</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0b0b0b;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================
           HEADER
        ========================== */

        .gallery {
            max-width: 1100px;
            margin: auto;
            padding: 70px 25px;
            text-align: center;
        }

        .title {
            margin-bottom: 50px;
        }

        .title h1 {
            font-size: clamp(40px, 7vw, 70px);
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .title p {
            color: #aaa;
            font-size: 18px;
        }

        .line {
            width: 80px;
            height: 3px;
            background: white;
            margin: 25px auto;
        }

        /* =========================
           TOMBOL MUSIK
        ========================== */

        .music-button {
            display: inline-block;
            margin-bottom: 50px;
            padding: 15px 30px;
            border: 1px solid #444;
            border-radius: 50px;
            background: #fff;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .music-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255,255,255,.15);
        }

        /* =========================
           FOTO
        ========================== */

        .photo-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 45px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
            transition: .3s;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            border-color: #666;
        }

        .photo-card a {
            display: block;
        }

        .photo-card img {
    width: 70%;
    max-width: 650px;
    max-height: 500px;
    object-fit: contain;
    border-radius: 12px;
    display: block;
    margin: 0 auto;
    cursor: pointer;
    transition: .3s;
}

        .photo-card img:hover {
            transform: scale(1.01);
        }

        .caption {
            padding: 20px 10px 10px;
            color: #bbb;
            font-size: 17px;
        }

        /* =========================
           KEMBALI
        ========================== */

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            border: 1px solid #444;
            border-radius: 40px;
            color: #aaa;
            text-decoration: none;
            transition: .3s;
        }

        .back-button:hover {
            color: white;
            border-color: white;
            transform: scale(1.04);
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            margin-top: 70px;
            color: #555;
            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .gallery {
                padding: 50px 15px;
            }

            .title {
                margin-bottom: 35px;
            }

            .photo-card {
                padding: 10px;
                border-radius: 15px;
            }

            .photo-card img {
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="gallery">

        <!-- =========================
             JUDUL
        ========================== -->

        <div class="title">

            <h1>Foto Sprint.Gio</h1>

            <p>
                Dokumentasi perjalanan Sprint.Gio
            </p>

            <div class="line"></div>

        </div>


        <!-- =========================
             MUSIK
        ========================== -->

        <audio id="bgMusic" loop>
            <source
                src="Never%20Give%20Up%20%28The%20Jagg%20Remix%29%20%5Bvbf0KIdWDOk%5D.mp3"
                type="audio/mpeg"
            >
        </audio>

        <button
            class="music-button"
            onclick="toggleMusic()"
            id="musicButton"
        >
            ▶ Putar Musik
        </button>


        <!-- FOTO 1 -->
<div class="photo-card">
    <img src="foto1.jpg" alt="Sprint.Gio Foto 1">
    <div class="caption">
        bagian komponen mesin di custome sesuai kebutuhan
    </div>
</div>


<!-- TOMBOL KEMBALI -->
<a href="index.html" class="back-button">
    ← Kembali ke cerita
</a>

            </a>

            <div class="caption">
                Sprint.Gio — SMR GARAGE77
            </div>

        </div>


    
        <!-- =========================
             KEMBALI KE CERITA
        ========================== -->

        <a
            href="index.html"
            class="back-button"
        >
            ← Kembali ke cerita
        </a>


        <footer>
            © 2026 Sprint.Gio — A Story of Coraggio
        </footer>

    </div>


    <!-- =========================
         JAVASCRIPT MUSIK
    ========================== -->

    <script>

        const music = document.getElementById("bgMusic");
        const musicButton = document.getElementById("musicButton");

        music.volume = 0.5;


        function toggleMusic() {

            if (music.paused) {

                music.play()
                    .then(function() {

                        musicButton.innerHTML = "⏸ Pause Musik";

                    })
                    .catch(function(error) {

                        alert("Musik belum bisa diputar. Pastikan file MP3 sudah di-upload ke GitHub.");

                        console.log(error);

                    });

            } else {

                music.pause();

                musicButton.innerHTML = "▶ Putar Musik";

            }

        }


        music.addEventListener("ended", function() {

            musicButton.innerHTML = "▶ Putar Musik";

        });

    </script>

</body>
</html>
